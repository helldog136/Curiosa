name: Release
# Cycle de release :
# - push sur dev : snapshot (pré-version dev-…), jamais proposé par les mises à jour d'une instance ;
# - release candidate vX.Y.Z-rc.N : proposée seulement aux instances qui ont choisi le canal « rc » (mode avancé). Elle est publiée quand `package.json`
#   porte une version `X.Y.Z-rc.N` sur dev (ou quand on pose l'étiquette vX.Y.Z-rc.N) ;
# - fusion de dev dans master (ou main) : RELEASE STABLE vX.Y.Z, où X.Y.Z est la version de package.json (rien si cette version est déjà publiée).
#
# Jobs (docs/ideas/update-paths.md) :
#   plan        quoi publier (version, étiquette, pré-version ?) et si l'image Docker suit ;
#   build       l'archive x64 (CI complète, empaquetage, smoke) : OBLIGATOIRE et stricte, c'est ce que `publish` attend ;
#   build-arm   l'archive arm64 sur un exécuteur arm64 NATIF, testée de la même façon : NON BLOQUANTE tant que ce chemin n'a pas fait ses preuves
#               (continue-on-error + `publish` ne l'attend pas). Variable de dépôt CURIOSA_ARM_REQUIRED=true : elle devient bloquante ;
#   publish     la release GitHub (archive x64, upgrade.json, install.sh) — la seule étape qui crée la release. `publish-required` fait la même
#               chose en attendant aussi l'arm64 (CURIOSA_ARM_REQUIRED=true) ; `publish-arm` ajoute l'archive arm64 à la release SI elle a réussi,
#               sans jamais modifier ni supprimer un autre fichier ;
#   image-arch  l'image Docker de chaque architecture, construite DEPUIS l'archive (aucune compilation), démarrée et vérifiée, PUIS envoyée à GHCR ;
#   image       la liste de manifestes (arm64 seulement si son image a réussi, sinon amd64 seul, et le résumé le dit) et ses étiquettes
#               (X.Y.Z, X.Y et latest seulement pour une stable).
# Une image qui échoue ne fait JAMAIS échouer ni ne supprime la release (jobs en continue-on-error, `publish` ne dépend d'aucun job d'image).
# Essai à blanc : « Run workflow » sur n'importe quelle branche construit et vérifie les archives et l'image, et envoie l'image sous l'étiquette jetable
# `dry-run-<sha>` (jamais `latest`, jamais une étiquette de version) ; aucune release n'est créée.
on:
  push:
    branches: [dev, master, main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
  workflow_dispatch:
    inputs:
      image_dry_run:
        description: "Essai à blanc : construire archives et image, envoyer l'image sous dry-run-<sha> (sans release, sans latest)"
        type: boolean
        default: true
      release_tag:
        description: "Images d'une release EXISTANTE (ex. v0.6.14) : reconstruites depuis les archives publiées de cette release et envoyées avec les étiquettes habituelles. Remplace l'essai à blanc. Sert aussi à relancer un envoi d'image échoué."
        type: string
        default: ""
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      pre: ${{ steps.v.outputs.pre }}
      publish: ${{ steps.v.outputs.publish }}
      pack: ${{ steps.v.outputs.pack }}
      image: ${{ steps.v.outputs.image }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      retag: ${{ steps.v.outputs.retag }}
      revision: ${{ steps.v.outputs.revision }}
      image_name: ${{ steps.v.outputs.image_name }}
      image_tags: ${{ steps.v.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version à publier
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.image_dry_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          base=$(node -p "require('./package.json').version")
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "image=false" >> "$GITHUB_OUTPUT"
          echo "retag=false" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            # Images d'une release EXISTANTE : rien n'est empaqueté ni publié, les archives viennent de la release elle-même.
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::release_tag doit être vX.Y.Z ou vX.Y.Z-rc.N"; exit 1; }
            gh release view "$RELEASE_TAG" >/dev/null || { echo "::error::la release $RELEASE_TAG n'existe pas"; exit 1; }
            base="${RELEASE_TAG#v}"
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"; echo "pack=false" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "retag=true" >> "$GITHUB_OUTPUT"
            echo "revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # Essai à blanc : rien n'est publié ; on construit tout pour pouvoir vérifier l'image.
            echo "tag=dry-run-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "pack=true" >> "$GITHUB_OUTPUT"
            if [[ "$DRY_RUN" == "true" ]]; then echo "image=true" >> "$GITHUB_OUTPUT"; echo "dry_run=true" >> "$GITHUB_OUTPUT"; fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/dev && "$base" == *-rc.* ]]; then
            # version de package.json = release candidate : on publie vX.Y.Z-rc.N (une seule fois), sans avoir à poser d'étiquette
            echo "tag=v$base" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
            if gh release view "v$base" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$base est déjà publiée : montez le numéro de rc dans package.json"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          elif [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            echo "tag=dev-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$base" == *-* ]]; then echo "::error::package.json porte une pré-version ($base) : une release stable doit être X.Y.Z"; exit 1; fi
            echo "tag=v$base" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"
            if gh release view "v$base" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$base est déjà publiée : rien à faire (montez la version dans package.json)"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          fi
          # Les archives sont construites quand on publie ; l'image suit une version (stable ou rc), jamais un instantané dev-…
          if [[ "$EVENT" != "workflow_dispatch" ]]; then
            publish=$(grep '^publish=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            tag=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            echo "pack=$publish" >> "$GITHUB_OUTPUT"
            if [[ "$publish" == "true" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then echo "image=true" >> "$GITHUB_OUTPUT"; fi
          fi
          # Nom de l'image : le dépôt, en minuscules (GHCR l'exige) ; étiquettes : la politique de scripts/install-kind.mjs (latest seulement pour une stable).
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            # Même politique d'étiquettes, mais X.Y et latest ne reculent jamais (on peut reconstruire une ancienne release).
            stable=$(gh release list --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | tr '\n' ' ')
            tags=$(node --input-type=module -e 'import { imageTagsForExisting } from "./scripts/install-kind.mjs"; console.log(imageTagsForExisting(process.argv[1], process.argv.slice(2)).join(" "))' "$base" $stable)
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then tags="dry-run-${GITHUB_SHA::7}"
          else tags=$(node --input-type=module -e 'import { imageTagsFor } from "./scripts/install-kind.mjs"; console.log(imageTagsFor(process.argv[1]).join(" "))' "$base"); fi
          echo "image_tags=$tags" >> "$GITHUB_OUTPUT"

  # x64 : l'archive de référence. CI complète (failles, types, tests, build), empaquetage, test de fumée de l'archive RÉELLE : obligatoire.
  build:
    needs: plan
    if: needs.plan.outputs.retag != 'true'
    runs-on: ubuntu-latest # linux-x64 : la plateforme des serveurs d'hébergement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # une release n'existe que si tout passe : failles connues, types, tests, build
      - run: npm run audit
      - run: npx tsc --noEmit
      - run: node scripts/migrations-sunset.mjs --check
      - run: npm test
      - run: npm run build
      - run: npm prune --omit=dev
      - run: npx prisma generate
      # Le cœur s'installe SEUL : l'archive ne contient aucun module (les modules s'installent depuis le catalogue, dépôt curiosa-extras par défaut)
      - name: Empaqueter
        if: needs.plan.outputs.pack == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-pack.mjs "$VERSION" dist
      # une archive qui ne démarre pas n'est jamais publiée : on la décompresse ailleurs et on la démarre (installation neuve ET mise à jour d'un site existant)
      - name: Test de fumée de l'archive
        if: needs.plan.outputs.pack == 'true'
        run: node scripts/smoke-release.mjs dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.pack == 'true'
        with:
          name: dist-x64
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # arm64 : même empaquetage et même test de fumée, sur un exécuteur arm64 natif (le moteur Prisma et sharp viennent d'un `npm ci` natif).
  # NON BLOQUANT : un échec (exécuteur absent, moteur, sharp…) ne touche ni `publish` ni la release x64 ; `ok` n'est vrai que si tout a réussi.
  # CURIOSA_ARM_REQUIRED=true (variable de dépôt) le rend bloquant : `publish-required` l'attend.
  build-arm:
    needs: plan
    if: needs.plan.outputs.pack == 'true'
    continue-on-error: ${{ vars.CURIOSA_ARM_REQUIRED != 'true' }}
    runs-on: ${{ vars.CURIOSA_ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run build
      - run: npm prune --omit=dev
      - run: npx prisma generate
      - name: Empaqueter
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-pack.mjs "$VERSION" dist
      - name: Test de fumée de l'archive
        run: node scripts/smoke-release.mjs dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arm64
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Archive arm64 prête
        id: done
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # La release : seulement ce que `build` (x64, strict) a produit. N'attend PAS l'arm64 : un exécuteur arm64 absent ou en panne ne retarde ni n'empêche rien.
  publish:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.publish == 'true' && vars.CURIOSA_ARM_REQUIRED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Notes de version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        # Le texte de la release est la section du CHANGELOG.md de cette version (ce qui change depuis la précédente) ; à défaut, un renvoi vers le fichier.
        run: node scripts/changelog.mjs "$VERSION" > "$RUNNER_TEMP/notes.md" || echo "Voir le CHANGELOG.md du dépôt." > "$RUNNER_TEMP/notes.md"
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRE: ${{ needs.plan.outputs.pre }}
        run: |
          flags="--target $GITHUB_SHA"
          [[ "$PRE" == "true" ]] && flags="$flags --prerelease"
          [[ "$GITHUB_REF" == refs/tags/* ]] && flags="--prerelease"
          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $flags

  # CURIOSA_ARM_REQUIRED=true : même release, mais l'archive arm64 doit exister (et avoir passé son test) : elle est publiée avec les autres fichiers.
  publish-required:
    needs: [plan, build, build-arm]
    if: ${{ needs.plan.outputs.publish == 'true' && vars.CURIOSA_ARM_REQUIRED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Notes de version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        # Le texte de la release est la section du CHANGELOG.md de cette version (ce qui change depuis la précédente) ; à défaut, un renvoi vers le fichier.
        run: node scripts/changelog.mjs "$VERSION" > "$RUNNER_TEMP/notes.md" || echo "Voir le CHANGELOG.md du dépôt." > "$RUNNER_TEMP/notes.md"
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRE: ${{ needs.plan.outputs.pre }}
        run: |
          flags="--target $GITHUB_SHA"
          [[ "$PRE" == "true" ]] && flags="$flags --prerelease"
          [[ "$GITHUB_REF" == refs/tags/* ]] && flags="--prerelease"
          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $flags

  # Ajoute l'archive arm64 à la release déjà publiée, seulement si elle a réussi son test. Ne remplace, ne modifie et ne supprime AUCUN fichier (pas de --clobber).
  publish-arm:
    needs: [plan, build-arm, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.build-arm.outputs.ok == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist
      - name: Ajouter l'archive arm64 à la release (seulement ce qui manque)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive=$(ls dist/curiosa-*-linux-arm64.tar.gz)
          (cd dist && sha256sum -c "$(basename "$archive").sha256")
          # `publish` joint déjà l'archive arm64 quand elle est prête avant lui : on ne remonte que les fichiers absents, sans jamais en remplacer un.
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          missing=()
          for f in "$archive" "$archive.sha256"; do
            if grep -qxF "$(basename "$f")" <<<"$existing"; then echo "déjà présent : $(basename "$f")"; else missing+=("$f"); fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then gh release upload "$TAG" "${missing[@]}" --repo "$REPO"; fi

  # Une image par architecture, sur un exécuteur de cette architecture (aucune émulation) : construite depuis l'archive de `build`, démarrée et vérifiée
  # (scripts/smoke-image.mjs), puis seulement ENVOYÉE (par empreinte, sans étiquette). Après `publish` : si l'image échoue, la release existe déjà.
  image-arch:
    needs: [plan, build, build-arm, publish, publish-required]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.plan.outputs.retag == 'true') && needs.plan.outputs.image == 'true' && (needs.publish.result == 'success' || needs.publish-required.result == 'success' || needs.plan.outputs.dry_run == 'true' || needs.plan.outputs.retag == 'true') }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, docker_arch: amd64, runner: ubuntu-latest }
          # arm64 : sans archive arm64 valide (build-arm en échec), cette branche ne fait rien et n'envoie rien ; le manifeste sera alors amd64 seul.
          - { arch: arm64, docker_arch: arm64, runner: "${{ vars.CURIOSA_ARM_RUNNER || 'ubuntu-24.04-arm' }}" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        with: { node-version: 22 }
      # Release normale : l'archive vient du job de build (celle qui a passé le test de fumée).
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.retag != 'true' && (matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true') }}
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      # Images d'une release existante : l'archive publiée sur la release (vérifiée par son sha256 à l'étape suivante).
      - name: Archive de la release existante
        if: ${{ needs.plan.outputs.retag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "curiosa-*-linux-${ARCH}.tar.gz" --pattern "curiosa-*-linux-${ARCH}.tar.gz.sha256" --dir dist
      - name: Contexte de construction (l'archive vérifiée, rien d'autre)
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          archive=$(ls dist/curiosa-*-linux-*.tar.gz)
          [[ $(echo "$archive" | wc -l) == 1 ]]
          (cd dist && sha256sum -c "$(basename "$archive").sha256")
          mkdir docker-context
          cp "$archive" "docker-context/archive-${DOCKER_ARCH}.tar.gz"
          cp Dockerfile docker-context/Dockerfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
      - name: Image locale (pour la vérification)
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker-context
          platforms: linux/${{ matrix.docker_arch }}
          load: true
          tags: curiosa-smoke:${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.revision }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
      - name: Image précédente (si elle existe)
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.plan.outputs.image_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          prev=$(gh release list --exclude-pre-releases --limit 5 --json tagName --jq '.[].tagName' | sed 's/^v//' | grep -vx "$VERSION" | head -1 || true)
          if [[ -n "$prev" ]] && docker pull "$IMAGE:$prev" >/dev/null 2>&1; then echo "ref=$IMAGE:$prev" >> "$GITHUB_OUTPUT"; echo "image précédente : $IMAGE:$prev"; else echo "aucune image précédente : le scénario de mise à jour est sauté"; fi
      - name: Test de fumée de l'image (volume vide, PUID/PGID, refus, données précédentes)
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PREVIOUS: ${{ steps.prev.outputs.ref }}
        run: node scripts/smoke-image.mjs "curiosa-smoke:$ARCH" --version "$VERSION" ${PREVIOUS:+--previous "$PREVIOUS"}
      # La vérification a réussi : on envoie, par empreinte (aucune étiquette ici ; elles sont posées une fois les deux architectures prêtes).
      - name: Envoi de l'image par empreinte (avec provenance et SBOM)
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker-context
          platforms: linux/${{ matrix.docker_arch }}
          outputs: type=image,name=${{ needs.plan.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.revision }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
      - name: Garder l'empreinte
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.arch == 'x64' || needs.build-arm.outputs.ok == 'true' || needs.plan.outputs.retag == 'true' }}
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 7
          if-no-files-found: error

  image:
    needs: [plan, image-arch]
    if: ${{ !cancelled() && needs.plan.outputs.image == 'true' && needs.image-arch.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # amd64 est obligatoire ; arm64 seulement s'il a été envoyé (sinon le manifeste est amd64 seul, et le résumé le dit).
      - uses: actions/download-artifact@v4
        with:
          name: digests-x64
          path: digests/amd64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: digests-arm64
          path: digests/arm64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Liste de manifestes multi-architecture et étiquettes
        env:
          IMAGE: ${{ needs.plan.outputs.image_name }}
          TAGS: ${{ needs.plan.outputs.image_tags }}
        run: |
          set -euo pipefail
          [[ $(ls digests/amd64 | wc -l) == 1 ]] # amd64 : obligatoire
          args=()
          for t in $TAGS; do [[ "$t" =~ ^[A-Za-z0-9._-]+$ ]] && args+=(-t "$IMAGE:$t"); done
          refs=("$IMAGE@sha256:$(ls digests/amd64)")
          if [[ -d digests/arm64 && $(ls digests/arm64 | wc -l) == 1 ]]; then
            refs+=("$IMAGE@sha256:$(ls digests/arm64)")
          else
            echo "::warning::l'image arm64 n'est pas disponible : manifeste amd64 seul"
            echo "**Manifeste amd64 seul** : l'image arm64 n'a pas été produite (voir les jobs image-arch / build-arm)." >> "$GITHUB_STEP_SUMMARY"
          fi
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          first=$(echo "$TAGS" | cut -d' ' -f1)
          docker buildx imagetools inspect "$IMAGE:$first" | tee -a "$GITHUB_STEP_SUMMARY"
