name: Release
# - étiquette vX.Y.Z (sur main/master) : release stable, proposée à toutes les instances ;
# - étiquette vX.Y.Z-rc.N (sur dev) : release candidate, proposée seulement aux instances qui ont choisi le canal « rc » (mode avancé) ;
# - push sur dev : snapshot (pré-version dev-…), jamais proposé par les mises à jour d'une instance.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
    branches: [dev]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest # linux-x64 : la plateforme des serveurs d'hébergement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # une release n'existe que si tout passe : failles connues, types, tests, build
      - run: npm run audit
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Version à publier
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          else
            base=$(node -p "require('./package.json').version")
            echo "version=$base" >> "$GITHUB_OUTPUT"; echo "tag=dev-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm prune --omit=dev
      - run: npx prisma generate
      - name: Empaqueter
        run: node scripts/release-pack.mjs "${{ steps.v.outputs.version }}" dist
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""; [[ "${{ steps.v.outputs.pre }}" == "true" ]] && flags="--prerelease"; [[ "$GITHUB_REF" == refs/tags/* ]] || flags="--prerelease --target $GITHUB_SHA"
          gh release create "${{ steps.v.outputs.tag }}" dist/* --title "${{ steps.v.outputs.tag }}" --generate-notes $flags
